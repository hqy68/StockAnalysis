<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock History</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header>
    <h1>Stock History</h1>
    <p class="sub">Azure SQL · Node.js API · Python analytics</p>
  </header>

  <main>
    <form id="filters">
      <label>Symbol
        <select id="symbol"></select>
      </label>
      <label>From <input type="date" id="from" /></label>
      <label>To <input type="date" id="to" /></label>
      <label>Rows
        <input type="number" id="limit" value="500" min="1" max="5000" />
      </label>
      <button type="submit">Load</button>
    </form>

    <p id="status" role="status"></p>

    <details id="config" class="config" open>
      <summary>Connection (troubleshooting)</summary>
      <dl class="conn">
        <dt>SQL server</dt><dd id="conn-server">…</dd>
        <dt>Database</dt><dd id="conn-database">…</dd>
        <dt>Connection string</dt><dd id="conn-string">…</dd>
      </dl>
      <p class="sub">Environment variables</p>
      <table><tbody></tbody></table>
    </details>

    <section id="stats" class="stats" hidden></section>

    <section class="chart-wrap" id="chart-wrap" hidden>
      <div id="chart"></div>
    </section>

    <section class="table-wrap">
      <table id="table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
